name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # เครื่องของ GitHub มี Android SDK อยู่แล้วที่ $ANDROID_HOME
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - name: Install packages
        run: npm ci

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk somsri-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: somsri-${{ github.run_number }}
          path: somsri-${{ github.run_number }}.apk

      - name: Publish to Releases (download from the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: สมศรี เวอร์ชัน ${{ github.run_number }}
          body: ดาวน์โหลดไฟล์ somsri-${{ github.run_number }}.apk ด้านล่างแล้วกดติดตั้ง
          files: somsri-${{ github.run_number }}.apk
          make_latest: true
